seed: 42
exp_name: my_experiment
wandb_project_name: aaas_project
wandb_entity: aarcara
video_dir: ./videos
eval_interval: 10
env_config:
  num_envs: 15
  layouts:
    - cramped_room
    - asymmetric_advantages
    - coordination_ring
    - counter_circuit
    - forced_coordination
  info_level: 0
  encoding: lossless 
  horizon: 400
  shaping_mode: shared 
training_config:
  num_steps: 400
  total_updates: 5_000_000
  gae_lambda: 0.90
  gae_gamma: 0.99
  update_epochs: 10
  minibatch_size: 4096 
  learning_rate: 2.5e-4
  value_coef: 0.5
  entropy_coef: 0.1
  use_learning_rate_annealing: true
  use_advantage_normalization: true
  use_gradient_clipping: true
  use_parameter_sharing: false
  network:
    type: cnn 
    shared_backbone: false
    num_filters: [32, 64, 64]
    kernel_sizes: [5, 3, 3]
    strides: [1, 1, 1]
    paddings: ["SAME", "SAME", "SAME"]
    embedding_dim: 512